name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  # The upstream time zone data release the test suite runs against. Bump it
  # to test against a newer release; the cache key follows it.
  TZ_WORLD_DATA_RELEASE: "2026d"

permissions:
  contents: read

jobs:
  # Installs the time zone data once and caches it for every test job.
  # `mix tz_world.update` looks up the latest release through the GitHub API,
  # which rate limits by runner IP, so a cache miss in every matrix entry made
  # CI fail at random. This job downloads the pinned release from its asset
  # URL instead, which is not rate limited, and only on a cache miss.
  data:
    name: Time zone data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Look up cached time zone data
        id: cache
        uses: actions/cache@v5
        with:
          path: priv/timezones-geodata.tzw1
          key: tz-world-geodata-${{ env.TZ_WORLD_DATA_RELEASE }}
          lookup-only: true

      - name: Set up Elixir
        if: steps.cache.outputs.cache-hit != 'true'
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20-otp-29"
          otp-version: "29"

      - name: Install time zone data
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          DATA_URL: https://github.com/evansiroky/timezone-boundary-builder/releases/download/${{ env.TZ_WORLD_DATA_RELEASE }}/timezones.geojson.zip
        run: |
          mix deps.get
          mix run -e '{:ok, _} = TzWorld.Downloader.get_latest_release(System.fetch_env!("TZ_WORLD_DATA_RELEASE"), System.fetch_env!("DATA_URL"))'

  test:
    name: "Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}${{ matrix.lint && ' (lint)' || '' }}"
    runs-on: ubuntu-latest
    needs: data

    strategy:
      fail-fast: false
      # Elixir and OTP are given as minor/major only so setup-beam resolves
      # the latest patch of each on every run, rather than pinning patches
      # that silently go stale.
      matrix:
        include:
          # Elixir 1.17 — supports OTP 26–27
          - elixir: "1.17-otp-26"
            otp: "26"
          - elixir: "1.17-otp-27"
            otp: "27"

          # Elixir 1.18 — supports OTP 26–27
          - elixir: "1.18-otp-26"
            otp: "26"
          - elixir: "1.18-otp-27"
            otp: "27"

          # Elixir 1.19 — supports OTP 26–28
          - elixir: "1.19-otp-26"
            otp: "26"
          - elixir: "1.19-otp-27"
            otp: "27"
          - elixir: "1.19-otp-28"
            otp: "28"

          # Elixir 1.20 — supports OTP 27–29
          - elixir: "1.20-otp-27"
            otp: "27"
          - elixir: "1.20-otp-28"
            otp: "28"
          - elixir: "1.20-otp-29"
            otp: "29"
            lint: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # The cache key carries both the Elixir and the OTP version. BEAM files
      # are version tagged, so a key without them hands one toolchain's build
      # artifacts to another and produces spurious MatchError crashes.
      - name: Restore dependency cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting
        if: matrix.lint
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # The data job has cached it. The suite exercises no backend that needs
      # the much larger .dets cache, so the .tzw1 file is all it restores.
      - name: Restore time zone data
        uses: actions/cache/restore@v5
        with:
          path: priv/timezones-geodata.tzw1
          key: tz-world-geodata-${{ env.TZ_WORLD_DATA_RELEASE }}
          fail-on-cache-miss: true

      - name: Run tests
        run: mix test

      - name: Restore PLT cache
        if: matrix.lint
        uses: actions/cache@v5
        with:
          path: _build/dev/dialyxir_*
          key: plt-${{ matrix.elixir }}-${{ matrix.otp }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            plt-${{ matrix.elixir }}-${{ matrix.otp }}-

      - name: Run dialyzer
        if: matrix.lint
        env:
          MIX_ENV: dev
        run: mix dialyzer
